# Teste de validação e cenários de erro
appId: com.habitai.app
env:
  TEST_USER_EMAIL: "test@example.com" # ATENÇÃO: Substituir pelo email de teste real
  TEST_USER_PASSWORD: "password123" # ATENÇÃO: Substituir pela senha de teste real
  PERFORM_SETUP_FLOWS: true
---
# --- Seção de Setup: Onboarding e Login ---
- runFlow:
    when:
      condition: "${PERFORM_SETUP_FLOWS == true && visible(text: '.*(Bem-vindo|Começar|Próximo|Pular).*')}"
    file: ./shared_onboarding_flow.yaml
    env:
      ONBOARDING_COMPLETED: true

- runFlow:
    when:
      condition: "${PERFORM_SETUP_FLOWS == true && visible(text: '.*Log In.*')}"
    file: ./shared_login_flow.yaml
    env:
      EMAIL: "${TEST_USER_EMAIL}"
      PASSWORD: "${TEST_USER_PASSWORD}"
      LOGIN_COMPLETED: true

- waitForAnimationToEnd
- assertVisible: ".*Hoje.*" # Confirma que estamos na HomeScreen

# --- Teste 1: Tentar criar hábito sem nome ---
- label: "Teste de Campo Obrigatório - Nome do Hábito"
# Navegar para o início do fluxo de criação de hábito
- tapOn:
    anyOf:
      - id: ".*add_habit_fab.*"
      - text: ".*Adicionar.*"
      - icon: "add"
- waitForAnimationToEnd
- assertVisible: ".*Selecione uma categoria.*" # Tela AddHabitScreen
- tapOn: "Saúde" # Seleciona uma categoria qualquer
- waitForAnimationToEnd
- tapOn: "PRÓXIMA" # Botão em AddHabitScreen
- waitForAnimationToEnd
- assertVisible: ".*Como você quer monitorar.*" # Tela HabitTrackingTypeScreen
- tapOn: "Sim ou Não" # Seleciona um tipo de tracking
- waitForAnimationToEnd
- tapOn: "PRÓXIMA" # Botão em HabitTrackingTypeScreen
- waitForAnimationToEnd
- assertVisible: ".*Qual o nome do seu novo hábito.*" # Tela AddHabitTitleScreen

# Agora, na tela de título, NÃO inserir texto e tentar avançar/salvar
# O botão "PRÓXIMA" nesta tela deve estar desabilitado ou mostrar erro ao ser tocado se o nome estiver vazio.
# Se o botão estiver habilitado e permitir avançar, o erro pode aparecer na tela de frequência ou resumo.
# Vamos assumir que o erro é validado na AddHabitTitleScreen ao tentar avançar.

- tapOn: "PRÓXIMA" # Tenta avançar sem nome
- waitForAnimationToEnd

# Verificar mensagem de erro para campo de nome obrigatório
# A mensagem exata pode variar.
- assertVisible:
    text: ".*[Pp]reencha.*[Nn]ome.*|.*[Nn]ome.*[Oo]brigatório.*|.*[Ii]nsira.*[Nn]ome.*"
    optional: true # Torna opcional se a UI impedir o toque ou o erro for diferente
- takeScreenshot: "validacao_nome_habito_obrigatorio"

# Voltar para a HomeScreen para o próximo teste (ou use back se o fluxo for modal)
# Se o fluxo de criação for uma série de pushReplacement, pode ser necessário um fluxo para cancelar/voltar
# Por simplicidade, vamos assumir que podemos voltar para a HomeScreen.
# Se o botão "PRÓXIMA" estava desabilitado, precisamos de um 'back' ou 'cancelar'.
- tapOn: # Botão de voltar/fechar na AppBar da AddHabitTitleScreen
    icon: "arrow_back" # ou 'close', dependendo do ícone usado
    optional: true
- waitForAnimationToEnd
- tapOn: # Botão de voltar/fechar na AppBar da HabitTrackingTypeScreen
    icon: "arrow_back" # ou 'close'
    optional: true
- waitForAnimationToEnd
- tapOn: # Botão de voltar/fechar na AppBar da AddHabitScreen
    icon: "close" # A AddHabitScreen usa 'close'
    optional: true
- waitForAnimationToEnd
- assertVisible: ".*Hoje.*" # Garante que voltou para a HomeScreen

# --- Teste 2: Nome de hábito muito longo (Verificar comportamento da UI) ---
- label: "Teste de Nome de Hábito Muito Longo"
- tapOn:
    anyOf:
      - id: ".*add_habit_fab.*"
      - text: ".*Adicionar.*"
      - icon: "add"
- waitForAnimationToEnd
- assertVisible: ".*Selecione uma categoria.*"
- tapOn: "Trabalho"
- waitForAnimationToEnd
- tapOn: "PRÓXIMA"
- waitForAnimationToEnd
- assertVisible: ".*Como você quer monitorar.*"
- tapOn: "Sim ou Não"
- waitForAnimationToEnd
- tapOn: "PRÓXIMA"
- waitForAnimationToEnd
- assertVisible: ".*Qual o nome do seu novo hábito.*"

