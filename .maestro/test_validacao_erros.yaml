Pode ser usado como uma ferramenta poderosa para ajudar a construir sites mais acessíveis e interativos.

O widget de conteúdo, também conhecido como "Rich Text Editor" ou "RTE", é uma ferramenta fundamental para a criação de conteúdo rico e dinâmicas em sites. Ele permite que os usuários criem e editem textos, imagens e outros elementos multimídia diretamente na página da web.

Nesta seção, você aprenderá como adicionar um widget de conteúdo em seu site e quais são seus principais casos de uso.

## Como adicionar o widget de conteúdo

Para adicionar um widget de conteúdo:

1.  Clique em **Editar páginas**.
2.  Arraste o **widget de conteúdo** para o seu site.

